<style>:root{color-scheme:dark;--bg:#0f172a;--panel:#111827;--line:#334155;--green:#16a34a;--red:#dc2626;--yellow:#facc15}*{box-sizing:border-box}body{background:var(--bg);color:#f8fafc;font:15px system-ui;margin:0}main{max-width:1050px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:clamp(26px,5vw,39px)}small{background:#233852;border-radius:8px;padding:5px;font-size:.5em}#clock{font-size:clamp(21px,4vw,30px);font-weight:800;color:var(--yellow);text-align:right;font-variant-numeric:tabular-nums}#clock span{display:block;color:#cbd5e1;font-size:12px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:11px 22px;background:#1b2b42;color:#cbd5e1;border:1px solid #31435f;border-radius:11px;font:700 15px system-ui;cursor:pointer}.tabs button[aria-selected=true]{background:#28476c;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;min-width:0}.heading{display:flex;gap:10px;justify-content:space-between;align-items:center}.heading b{font-size:21px}.status{font-size:12px;font-weight:700;background:#163323;color:#bbf7d0;border-radius:40px;padding:7px 10px}.status.stale,.status.suspended{color:#fde68a;background:#403116}.status.unknown{color:#cbd5e1;background:#334155}.metric{margin-top:14px;font-size:13px;color:#cbd5e1}.metric b{font-size:30px;color:white;margin-right:7px}.alert{background:#342710;color:#fcd34d;padding:10px;border-radius:9px;margin-top:12px;font-size:13px}.graph{height:147px;position:relative;margin:26px 0 0}.bar{position:absolute;left:0;right:0;top:52px;height:28px;border-radius:7px;overflow:hidden;background:var(--green)}.off{position:absolute;top:0;height:100%;background:var(--red)}.gray{position:absolute;top:0;height:100%;background:#475569}.gray:nth-child(odd){background:#334155}.bar.stale:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#facc1555 0 6px,transparent 6px 13px)}.axis{position:absolute;color:#cbd5e1;font-size:12px;font-weight:700;transform:translateX(-50%);white-space:nowrap}.axis.up{top:25px}.axis.down{top:94px}.axis.start{top:94px;left:0!important;transform:none}.axis.end{top:94px;left:100%!important;transform:translateX(-100%)}.marker{position:absolute;top:6px;transform:translateX(-50%);pointer-events:none;z-index:3}.marker em{font-size:11px;font-style:normal;white-space:nowrap;display:block;background:#302a20;border:1px solid #98741b;color:#facc15;border-radius:7px;padding:4px 7px;transform:translateX(-50%)}.marker i{display:block;background:#facc15;width:2px;height:71px;margin:auto}.intervals{display:flex;gap:8px;flex-wrap:wrap}.intervals span{padding:6px 10px;border-radius:8px;background:#1f3049;font-weight:700}.muted{font-size:13px;color:#94a3b8}.sources{margin-top:20px;border-top:1px solid #334155;padding-top:12px;font-size:13px}details summary{cursor:pointer;color:#cbd5e1;font-weight:650}a{color:#93c5fd}.event{background:#1b2b42;border-radius:10px;padding:12px;font-size:14px;margin-top:9px}.event b{display:block;color:#fcd34d;font-size:12px}.older{margin-top:16px}.history h2{margin:0;font-size:17px}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media(max-width:480px){.card{padding:14px}.axis{font-size:11px}h1{font-size:25px}}</style>
<main><header><h1>Вища Дубечня <small>3.1</small></h1><div id="clock">--:--:--</div></header><nav class="tabs"><button data-tab="today" aria-selected="true">Сьогодні</button><button data-tab="tomorrow" aria-selected="false">Завтра</button></nav><div class="layout"><section class="card"><div id="display"></div><details class="sources"><summary>Джерела</summary><div id="sources"></div></details></section><aside class="card history"><h2>Зміни графіка</h2><div id="latest"></div><details id="more" class="older"><summary>Попередні події</summary><div id="older"></div></details></aside></div></main>
<script>(function(){'use strict';let tab='today',data=null,dayShown='',modeShown='';const $=id=>document.getElementById(id),timeF=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}),dateF=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}),human=new Intl.DateTimeFormat('uk-UA',{timeZone:'UTC',day:'numeric',month:'long'});function now(){const t=Object.fromEntries(timeF.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value])),d=Object.fromEntries(dateF.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return {iso:d.year+'-'+d.month+'-'+d.day,time:t.hour+':'+t.minute+':'+t.second,display:d.day+'.'+d.month+'.'+d.year,h:+t.hour,m:+t.minute,s:+t.second}}function tomorrow(s){const a=s.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]+1)).toISOString().slice(0,10)}function minute(s){const a=s.split(':').map(Number);return a[0]*60+a[1]}function pct(x){return x*100/1440}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function selected(n){const iso=tab==='today'?n.iso:tomorrow(n.iso);return {iso,entry:data?.days?.[iso]||{status:'unknown',outages:[],detail:'Очікуємо графіка'}}}function currentStatus(e){let s=e.status||'unknown',age=data?.updated_at?(Date.now()-Date.parse(data.updated_at))/60000:Infinity;if(s==='normal'&&(age>75||age< -5))s='stale';return s}function paint(n){n=n||now();const {iso,entry:e}=selected(n),status=currentStatus(e),out=Array.isArray(e.outages)?e.outages:[],known=status!=='unknown',duration=out.reduce((sum,x)=>sum+minute(x[1])-minute(x[0]),0),mins=duration%60?Math.floor(duration/60)+' год '+duration%60+' хв':Math.floor(duration/60)+' год';let html='<div class="heading"><b>'+human.format(new Date(iso+'T12:00:00Z'))+'</b><span class="status '+status+'">'+({normal:'За графіком',stale:'Дані застаріли',unknown:'Графіка немає',suspended:'Графік не діє'}[status]||'Графіка немає')+'</span></div>';if(known)html+='<div class="metric"><b>'+mins+'</b>без світла за 24 години</div>';if(status==='stale')html+='<div class="alert">Останній підтверджений графік. Нові дані не підтверджені.</div>';if(status==='suspended')html+='<div class="alert">Графік не діє. Показано заплановані раніше години.</div>';html+='<div class="graph"><div class="bar '+(status==='stale'||status==='suspended'?'stale':'')+'">';if(!known){for(let i=0;i<8;i++)html+='<i class="gray" style="left:'+(i*12.5)+'%;width:12.5%"></i>'}else out.forEach(x=>html+='<i class="off" style="left:'+pct(minute(x[0]))+'%;width:'+pct(minute(x[1])-minute(x[0]))+'%"></i>');html+='</div><span class="axis start">00:00</span><span class="axis end">24:00</span>';if(known)out.forEach((x,i)=>{html+='<span class="axis up" style="left:'+pct(minute(x[0]))+'%">'+esc(x[0])+'</span><span class="axis '+(i%2?'up':'down')+'" style="left:'+pct(minute(x[1]))+'%">'+esc(x[1])+'</span>'});if(tab==='today')html+='<div class="marker" id="marker"><em id="markerLabel">Зараз</em><i></i></div>';html+='</div>';if(known)html+=out.length?'<div class="intervals">'+out.map(x=>'<span>'+esc(x[0])+'–'+esc(x[1])+'</span>').join('')+'</div>':'<div class="muted">Відключень немає</div>';else html+='<div class="muted">'+esc(e.detail||'Очікуємо підтвердження')+'</div>';$('display').innerHTML=html;const verified=new Set(e.sources||[]),urls={'БезСвітла':e.url||'https://bezsvitla.com.ua/kyivska-oblast','КолиСвітло':'https://kolysvitlo.com/schedule/dtek_kyiv_oblast','КолиБуде':'https://kolybude.com/kyiv-oblast'};$('sources').innerHTML=Object.entries(urls).map(([k,u])=>'<p><span style="color:'+(verified.has(k)?'#22c55e':'#94a3b8')+'">●</span> <a target="_blank" rel="noopener" href="'+esc(u)+'">'+k+'</a></p>').join('')+'<p>Перевірка: '+esc(data?.updated_at||'недоступна')+'</p><a href="https://www.dtek-krem.com.ua/ua/shutdowns">ДТЕК</a>';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));modeShown=status;move(n)}function move(n){const m=$('marker');if(m){m.style.left=pct(n.h*60+n.m+n.s/60)+'%';$('markerLabel').textContent='Зараз '+n.time.slice(0,5)}}function events(){const logs=data?.logs||[];$('latest').innerHTML=logs.length?'<div class="event"><b>'+esc(logs[0].at.replace('T',' · ').slice(0,16))+'</b>'+esc(logs[0].message)+'</div>':'<div class="event">Змін поки немає</div>';$('older').innerHTML=logs.slice(1).map(x=>'<div class="event"><b>'+esc(x.at.replace('T',' · ').slice(0,16))+'</b>'+esc(x.message)+'</div>').join('');$('more').hidden=logs.length<=1}function tick(){const n=now();$('clock').innerHTML=n.time+'<span>'+n.display+'</span>';const s=currentStatus(selected(n).entry);if(n.iso!==dayShown||s!==modeShown){dayShown=n.iso;paint(n)}move(n)}async function reload(){try{const r=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const j=await r.json();if(!j.days||!Array.isArray(j.logs))throw Error('payload');data=j;paint();events()}catch(e){if(!data)paint();console.warn(e)}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;paint()});dayShown=now().iso;tick();reload();setInterval(tick,1000);setInterval(reload,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reload()})})();</script></html>
