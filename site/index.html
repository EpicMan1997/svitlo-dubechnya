/* Compact header and recognizable bulb */
h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head-icon{width:35px;height:35px;flex:none;border-radius:10px;filter:drop-shadow(0 2px 6px #facc1520)}
.day-wrap{display:flex;flex-direction:column;line-height:1.17;gap:5px}
.heading .weekday{display:block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;letter-spacing:0;font-weight:680;font-style:normal;color:#b7c9e5}
.heading .calendar-date{font-size:23px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.025em;font-weight:770}
.schedule-details{margin-top:3px;border:1px solid #31425b;background:#162238;border-radius:11px;padding:0 14px}
.schedule-details summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;list-style:none;cursor:pointer;font-weight:680;color:#d9e7f8}
.schedule-details summary::-webkit-details-marker{display:none}
.schedule-details summary .chevron{font-size:19px;line-height:1;transition:transform .18s}
.schedule-details[open] summary .chevron{transform:rotate(180deg)}
.schedule-body{padding:0 0 15px}
.source-list{border-top:1px solid #354661;padding-top:8px;margin-top:12px;font-size:12px;color:#a9bdd6}
.source-list p{margin:8px 0}.source-list a{text-decoration:none}
.graph{cursor:crosshair;touch-action:pan-y}
.inspector{position:absolute;top:6px;transform:translateX(-50%);pointer-events:none;z-index:6}
.inspector[hidden]{display:none!important}
.inspector em{font-size:11px;font-style:normal;white-space:nowrap;display:block;position:absolute;top:0;background:#253953;border:1px solid #7dd3fc;color:#e0f2fe;border-radius:7px;padding:4px 7px}
.inspector i{position:absolute;top:30px;left:50%;width:2px;height:73px;background:#7dd3fc;box-shadow:0 0 0 1px #0f172a66}
.inspector.during-outage em{border-color:#fb7185;color:#fecdd3}
.inspector.during-outage i{background:#fb7185}
@media(max-width:480px){.head-icon{width:30px;height:30px}h1{gap:6px}.heading .weekday{font-size:17px}.heading .calendar-date{font-size:22px}}

/* Five source comparisons; site identity and agreement are separate signals */
.source-list{display:grid;gap:0;border-top:0;margin-top:0;padding-top:0;font-size:13px}
.source-row{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid #2b3d56}
.source-icon{width:9px;height:9px;border-radius:3px;flex:none;margin-top:7px}
.source-main{min-width:0;flex:1}.source-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px 8px}
.source-head a{color:#dce9fc;text-decoration:none;font-size:13px;font-weight:680}
.source-times{font-variant-numeric:tabular-nums;color:#b6c9de;line-height:1.5;font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.source-verdict{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;font-weight:680}
.source-verdict i,.overall-state i{display:inline-block;border-radius:99px;width:7px;height:7px;flex:none;background:currentColor}
.source-verdict.source-good{color:#4ade80}.source-verdict.source-bad{color:#fb7185}
.last-check{padding:11px 0 2px;color:#93a4be;font-size:12px}
.source-overall{padding:10px 0 2px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:7px;font-size:12px}
.overall-state{display:inline-flex;gap:7px;align-items:center;font-weight:760}
.overall-state.is-healthy{color:#4ade80}.overall-state.is-unhealthy{color:#fb7185}
.overall-count{color:#94a3b8;font-size:11px}

/* Tomorrow tab: inactive when no confirmed schedule, unread only for a new version */
.tabs .tomorrow-tab{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tabs .tomorrow-tab.unavailable{background:#273344;border-color:#3b495b;color:#94a3b8}

.tabs .tomorrow-tab.available{background:#1b2b42}
.tabs .tomorrow-tab.available[aria-selected="true"]{background:#28476c}
.new-dot{font-size:10px;line-height:1;color:#4ade80;text-shadow:0 0 8px #4ade8066}

.bar.unknown{background:#475569}
.bar.unknown:after{content:none}
.changes{padding:0}
.changes>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}

.changes-arrow{font-size:24px;flex:none;color:#b9cbe2;transition:transform .16s}
.changes[open] .changes-arrow{transform:rotate(180deg)}
.changes-content{margin-top:14px;border-top:1px solid #2c3b50;padding-top:2px}
.changes .event{margin-top:12px}
.event-evidence{margin-top:10px;font-size:12px;color:#bbf7d0;border-top:1px solid #36475f;padding-top:8px}
.event-minor{font-size:11px;color:#94a3b8;margin-top:5px;line-height:1.5}

/* Each comparison card keeps its natural height on mobile and desktop */
.layout{align-items:start}.history{align-self:start}
.location-shell{position:relative;min-width:0}
.location-button{display:inline-flex;align-items:center;gap:10px;min-width:0;padding:4px 7px;border:1px solid transparent;border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:inherit;font-weight:inherit;text-align:left;cursor:pointer}

.location-chevron{font-size:22px;color:#a8bed8}

.location-menu[hidden]{display:none}
.location-menu button{width:100%;display:block;text-align:left;background:transparent;border:0;border-radius:8px;padding:12px;color:#e5f0ff;font:600 14px system-ui;cursor:pointer}

.location-menu button small{display:block;margin-top:3px;color:#a8bad2;font-size:11px;background:none;padding:0}

@media(max-width:480px){.location-menu{left:0}.location-button #locationLabel{font-size:21px}.location-button{gap:5px}.location-chevron{font-size:18px}}

/* Quiet, fixed-width, non-animated disclosure arrows */
.location-chevron,.schedule-details summary .chevron,.changes-arrow{
  flex:0 0 16px!important;width:16px!important;height:18px!important;
  display:inline-block!important;position:relative;text-align:center;
