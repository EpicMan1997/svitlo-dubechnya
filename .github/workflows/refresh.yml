name: Наше Світло | оновлення графіків і публікація
on:
  push:
    branches: [main]
  # Reliable primary: external workflow_dispatch roughly every 10 minutes.
  # Best-effort evening fallback: check for newly released tomorrow schedules.
  # GitHub's native scheduler can be delayed; do not rely on it alone.
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 16-23 * * *'
      timezone: "Europe/Kyiv"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dubechnya-pages-v2
  # Never cancel a publish already running when scheduled checks overlap.
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/refresh.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Persist history (does not block publication)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json state/season.json
          if ! git diff --cached --quiet; then
            git commit -m "Update outage history"
            if ! git push; then
              echo "::warning::History push conflicted with a newer commit; keeping the published graph live."
            fi
          fi
